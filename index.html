<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W11 style Calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="calculator-container" class="rounded-corners">
        <div id="display"></div>
        <div id="keys">
            <div id="main-left-keys">
                <div id="upper-keys">
                    <button class="btn backspace"></button>
                    <button class="btn operator"></button>
                    <button class="btn operator"></button>
                </div>
                <div id="lower-keys">
                    <button class="btn backspace"></button>
                    <button class="btn digit"></button>
                    <button class="btn digit"></button>
                    <button class="btn digit"></button>
                    <button class="btn digit"></button>
                    <button class="btn digit"></button>
                    <button class="btn digit"></button>
                    <button class="btn digit"></button>
                    <button class="btn digit"></button>
                    <button class="btn clear"></button>
                    <button class="btn digit"></button>
                    <button class="btn digit"></button>
                </div>
            </div>
            <div id="main-right-keys">
                <button class="btn operator"></button>
                <button class="btn operator"></button>
                <button class="btn operator"></button>
                <button class="btn operator"></button>
                <button class="btn equals"></button>
            </div>
        </div>
    </div>
</body>

</html>
