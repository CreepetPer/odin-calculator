<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 style Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=backspace" />

    <script src="script.js"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: { '[+]': [['$', '$']] }
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
</head>

<body>
    <div id="calculator-container" class="rounded-corners">
        <div id="display">
            <div>0</div>
        </div>
        <div id="keys">
            <div id="main-left-keys">
                <div id="upper-keys">
                    <button class="btn backspace"><span class="material-symbols-outlined">
                            backspace
                        </span></button>
                    <button class="btn operator">$x^x$</button>
                    <button class="btn operator">$n!$</button>
                </div>
                <div id="lower-keys">
                    <button class="btn digit">7</button>
                    <button class="btn digit">8</button>
                    <button class="btn digit">9</button>
                    <button class="btn digit">4</button>
                    <button class="btn digit">5</button>
                    <button class="btn digit">6</button>
                    <button class="btn digit">1</button>
                    <button class="btn digit">2</button>
                    <button class="btn digit">3</button>
                    <button class="btn clear">AC</button>
                    <button class="btn digit">0</button>
                    <button class="btn digit">.</button>
                </div>
            </div>
            <div id="main-right-keys">
                <button class="btn operator">÷</button>
                <button class="btn operator">×</button>
                <button class="btn operator">-</button>
                <button class="btn operator">+</button>
                <button class="btn equals">=</button>
            </div>
        </div>
    </div>
</body>

</html>
